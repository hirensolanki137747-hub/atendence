<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login | AttendEase</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page" data-role="student" data-page="login"><a class="auth-brand" href="../index.html"><span class="brand-mark small">A</span> Attend<span>Ease</span></a><main class="auth-card"><div class="auth-icon student-icon">◉</div><p class="eyebrow">STUDENT ACCESS</p><h1>Your campus, at a glance.</h1><p class="muted">Sign in to check your attendance and profile.</p><form id="loginForm" novalidate><label>Student ID<input id="loginEmail" placeholder="e.g. MU2026001" autocomplete="username"><small class="field-error" id="loginEmailError"></small></label><label>Password<div class="password-wrap"><input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password"><button type="button" class="show-pass" data-toggle-password>Show</button></div><small class="field-error" id="loginPasswordError"></small></label><div id="loginError" class="form-error"></div><button class="btn btn-primary full" type="submit">Sign in to Student Portal →</button></form><div class="demo-note"><b>Demo student login</b><span>Student ID: MU2026001</span><span>Password: Student@123</span><small>More demo students use their ID and the same password.</small></div><a class="back-link" href="../index.html">← Back to portal selection</a></main><script src="../js/app.js"></script></body></html>
